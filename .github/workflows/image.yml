name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t app:ci .

      - name: Show the layers, the size and the CPU type
        run: |
          docker history app:ci
          docker image ls app:ci
          docker image inspect --format 'built for: {{.Os}}/{{.Architecture}}' app:ci

      - name: Run it on port 9123 and call /healthz
        run: |
          docker run -d --name app -e PORT=9123 -p 9123:9123 app:ci
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors http://localhost:9123/healthz
          echo
          docker inspect --format 'runs as user: {{.Config.User}}' app:ci

      - name: Show the container's output if anything failed
        if: failure()
        run: docker logs app || true