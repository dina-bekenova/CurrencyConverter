apiVersion: apps/v1
kind: Deployment
metadata:
  name: mine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mine
  template:
    metadata:
      labels:
        app: mine
    spec:
      containers:
        - name: app
          # 7. full 40-character SHA
          image: ghcr.io/dina-bekenova/currencyconverter:78899a2c708ea3ede13a1795df77d33aeac26b0b
          env:
            - name: PORT
              value: "8080"               # 8
          ports:
            - containerPort: 8080         # 9
---
apiVersion: v1
kind: Service
metadata:
  name: mine
spec:
  selector:
    app: mine
  ports:
    - port: 80
      targetPort: 8080                    # 10
